services:
  mail:
    image: tvial/docker-mailserver:latest
    hostname: ${HOSTNAME}
    domainname: ${DOMAINNAME}
    container_name: ${CONTAINER_NAME}
    ports:
      - "${MAIL_BIND_IP}:25:25"
      - "143:143"
      - "465:465"
      - "587:587"
      - "993:993"
    volumes:
      - maildata:/var/mail
      - mailstate:/var/mail-state
      - maillogs:/var/log/mail
      - ./config/:/tmp/docker-mailserver/
      - certs:/etc/letsencrypt/live
    environment:
      - HOSTNAME
      - DOMAINNAME
      - CONTAINER_NAME
    env_file:
      - env-mailserver
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
    restart: no
    networks:
      global-mail-network:
        aliases:
          # Allow connecting to this service via
          # mailgate mail.leo9000.de via local network
          - mailgate
          - mail.leo9000.de

  cert-companion:
    image: nginx
    restart: always
    environment:
      - VIRTUAL_HOST=${LETSENCRYPT_HOST}
      - LETSENCRYPT_HOST
      - LETSENCRYPT_EMAIL
    volumes:
      - "./www:/usr/share/nginx/html:ro"
    networks:
      global-proxy-network:

networks:
  global-mail-network:
    name: global-mail-network  # Forces exact name without 'mail_' prefix
  global-proxy-network:
    external: true
    # not marked as external although it is to avoid a dependency cycle when
    # installing the projects

volumes:
  maildata:
  mailstate:
  maillogs:
  certs:
    external: true
    name: frontend-proxy_certs

